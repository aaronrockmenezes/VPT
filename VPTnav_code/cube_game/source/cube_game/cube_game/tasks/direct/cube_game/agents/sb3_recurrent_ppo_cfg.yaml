# Reference: https://github.com/DLR-RM/rl-baselines3-zoo/blob/master/hyperparams/ppo.yml#L32
seed: 42

n_timesteps: !!float 1e7
policy: 'CnnLstmPolicy'
n_steps: 512
batch_size: 1024
n_epochs: 5
ent_coef: 0.01
clip_range: 0.2
learning_rate: !!float 1e-4
vf_coef: 0.5
gae_lambda: 0.95
gamma: 0.99
policy_kwargs:
  normalize_images: False
device: "cuda:0"